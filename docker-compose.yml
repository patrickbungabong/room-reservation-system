version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: room-reservation-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: room-reservation

  backend:
    build: ./backend
    container_name: room-reservation-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/room-reservation
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE: 7d
    depends_on:
      - mongodb

volumes:
  mongo_data:
